worker_processes 1;
events { worker_connections 256; }
# TCP passthrough from host-published ports into the isolated slot network.
stream {
  server { listen 8000; proxy_pass simulator-lite:8000; }
  server { listen 3000; proxy_pass companion-computer-lite:3000; }
  server { listen 6080; proxy_pass ground-control-station-lite:6080; }
  server { listen 7681; proxy_pass attacker:7681; }
}
